<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>三菱镭射质量控制系统</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html,
    body {
      height: 100dvh;
      overflow: hidden;
      font-size: calc(14px + 0.2vw);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "PingFang SC", "Hiragino Sans GB", sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1c1c1e;
      background: linear-gradient(
          135deg,
          #ff5f7e 0%,
          #ffba00 30%,
          #34c759 65%,
          #3a5bdb 100%
        )
        fixed;
      transition: color 0.3s;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -1;
      transform: scale(1.5);
      transform-origin: center;
      filter: blur(90px);
      animation: bg 16s linear infinite alternate;
      background:
        radial-gradient(circle at 20% 20%, #ff5f7e 0%, transparent 60%),
        radial-gradient(circle at 80% 15%, #ffba00 0%, transparent 60%),
        radial-gradient(circle at 50% 10%, #34c759 0%, transparent 60%),
        radial-gradient(circle at 10% 80%, #3a5bdb 0%, transparent 60%),
        radial-gradient(circle at 90% 75%, #ff3b30 0%, transparent 60%),
        radial-gradient(circle at 50% 90%, #af52de 0%, transparent 60%),
        radial-gradient(circle at 30% 50%, #ffc0cb 0%, transparent 60%),
        radial-gradient(circle at 70% 50%, #00ffff 0%, transparent 60%),
        radial-gradient(circle at 15% 40%, #ff4500 0%, transparent 60%),
        radial-gradient(circle at 85% 25%, #8a2be2 0%, transparent 60%),
        radial-gradient(circle at 40% 70%, #deb887 0%, transparent 60%),
        radial-gradient(circle at 60% 30%, #7fff00 0%, transparent 60%),
        radial-gradient(circle at 25% 85%, #ff1493 0%, transparent 60%),
        radial-gradient(circle at 75% 85%, #00fa9a 0%, transparent 60%),
        radial-gradient(circle at 35% 30%, #ffd700 0%, transparent 60%),
        radial-gradient(circle at 65% 65%, #87cefa 0%, transparent 60%);
    }
    @keyframes bg {
      0%   { transform: translate(0, 0) scale(1); }
      33%  { transform: translate(-25%, 8%) scale(1.05); }
      66%  { transform: translate(-50%, -6%) scale(1); }
      100% { transform: translate(-25%, 8%) scale(1.05); }
    }
    .container {
      width: 90%;
      max-width: 1000px;
      padding: 20px 50px 0;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 16px;
      box-shadow: 0 6px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
    }
    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #333;
      font-weight: 500;
    }
    .section { margin-bottom: 25px; }
    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #555;
    }
    input[type="text"],
    input[type="file"],
    select {
      width: 100%;
      padding: 10px 12px;
      margin: 6px 0 8px;
      font-size: 1rem;
      border-radius: 6px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: #1c1c1e;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input::placeholder { color: rgba(0, 0, 0, 0.4); }
    input:focus {
      border-color: #0a84ff;
      box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.3);
    }
    .btn-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }
    button {
      padding: 0 16px;
      height: 42px;
      min-width: 110px;
      border-radius: 6px;
      border: 1px solid transparent;
      font-size: 1rem;
      cursor: pointer;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      color: #1c1c1e;
      transition: background-color 0.2s, border-color 0.2s;
    }
    button:hover  { background: rgba(255, 255, 255, 0.45); }
    button:active { background: rgba(255, 255, 255, 0.6); border-color: rgba(0, 0, 0, 0.15); }
    .alert {
      display: none;
      padding: 12px 18px;
      margin: 20px 0;
      font-size: 0.9rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #1c1c1e;
    }
    .alert.success {
      background: rgba(230, 244, 234, 0.5);
      border-color: #c8e6c9;
      color: #1b5e20;
    }
    .alert.error {
      background: rgba(253, 236, 234, 0.5);
      border-color: #f5c6cb;
      color: #b71c1c;
    }
    @media (max-width: 768px) {
      .container { padding: 20px; }
      .btn-group { flex-direction: column; }
      button      { width: 100%; }
    }
    @media (min-width: 1200px) {
      .container { padding: 40px 60px 20px; }
      button     { font-size: 1.1rem; min-width: 130px; }
    }
    *, *::before, *::after {
      font-weight: 700 !important;
      color: #000 !important;
    }
    input[type=file]{
    padding:.5rem .75rem;
    cursor:pointer;
    }
    input[type=file]::file-selector-button,
    input[type=file]::-webkit-file-upload-button{
    font-weight:700;
    font-size:1rem;
    padding:.5rem .75rem;
    background:transparent;
    border:none;
    cursor:pointer;
    }
</style>
</head>
<body>
  <div class="container">
    <h1>三菱镭射质量控制系统</h1>
    <div id="msgResult" class="alert"></div>
    <div class="section">
      <label for="prgFile">选择 PRG 文件</label>
      <input type="file" id="prgFile" accept=".prg,.PRG" />
    </div>
    <div class="section">
      <label>选择加工模式：</label>
      <div class="btn-group" id="modeGroup">
        <button data-code="M330(8000)">标准模式</button>
        <button data-code="M331(10000)">高速模式</button>
      </div>
    </div>
    <div class="section">
      <label>选择加工质量等级：</label>
      <div class="btn-group" id="qualityGroup">
        <button data-code="M485(3000)">质量壹级</button>
        <button data-code="M486(2000)">质量贰级</button>
        <button data-code="M487(1000)">质量叁级</button>
      </div>
    </div>
    <div class="section">
      <label>选择配置文件与操作：</label>
      <div class="btn-group">
      <button id="btnDownload" type="button" tabindex="-1">生成文件</button>
      <button id="btnClear"    type="button">恢复默认配置</button>
      <button id="btnClearAll" type="button">清除配置文件</button>
      </div>
    </div>
  </div>
<script>
let prgContent = "";
let originalFileName = "";
let eol = "\r\n";
const controlCodes = [
  "M330",
  "M331",
  "M484",
  "M485",
  "M486",
  "M487",
  "M330(8000)",
  "M331(10000)",
  "M485(3000)",
  "M486(2000)",
  "M487(1000)"
];
const displayMsg = (msg, type = "success") => {
  const el = document.getElementById("msgResult");
  el.textContent = msg;
  el.className = `alert ${type}`;
  el.style.display = msg ? "block" : "none";
};
const detectEOL = txt => {
  return txt.includes("\r\n")
    ? "\r\n"
    : "\n";
};
const loadPrgFile = file => {
  if (!file || !/\.prg$/i.test(file.name)) {
    displayMsg(
      "与文件交互信息通知栏",
      "error"
    );
    return;
  }
  originalFileName = file.name;
  const reader = new FileReader();
  reader.onload = e => {
    prgContent = e.target.result;
    eol = detectEOL(prgContent);
    displayMsg(
      "文件加载成功，请选择对应加工模式。",
      "success"
    );
  };
  reader.readAsText(file);
};
const insertControlCode = (code, label) => {
  if (!prgContent) {
    displayMsg("请选择 PRG 文件", "error");
    return;
    }
    let lines = prgContent.split(/\r?\n/);
    lines = lines.filter(line => {
    return !controlCodes.includes(
    line.trim().toUpperCase()
    );
  });
  let inserted = false;
  for (let i = 0; i < lines.length; i++) {
    const current = lines[i]
      .replace(/\s+/g, "")
      .toUpperCase();
    if (current.includes("M98P9801")) {
      lines.splice(
        i + 1,
        0,
        code
      );
      inserted = true;
      break;
    }
  }
  if (!inserted) {
    displayMsg(
      "此程序不支持对应加工模式切换",
      "error"
    );
    return;
  }
  prgContent = lines.join(eol);
  displayMsg(
    label + " 已切换",
    "success"
  );
};
const clearControlCodes = () => {
  if (!prgContent) {
    displayMsg(
      "文件格式错误，请选择 PRG 加载文件。",
      "error"
    );
    return;
  }
  prgContent = prgContent
    .split(/\r?\n/)
    .filter(line => {
      return !controlCodes.includes(
        line.trim().toUpperCase()
      );
    })
    .join(eol);
  displayMsg(
    "已恢复默认配置",
    "success"
  );
};
const downloadFile = () => {
  if (!prgContent) {
    displayMsg(
      "文件格式错误，请选择 PRG 加载文件。",
      "error"
    );
    return;
  }
  const blob = new Blob(
    [prgContent],
    {
      type:
      "text/plain;charset=utf-8"
    }
  );
  const a = document.createElement("a");
  a.href =
    URL.createObjectURL(blob);
  a.download =
    originalFileName ||
    "modified.prg";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  displayMsg(
    "已生成文件",
    "success"
  );
};
const setupGroup = id => {
  document
  .getElementById(id)
  .addEventListener(
    "click",
    e => {
      const btn =
      e.target;
      if (
        btn.tagName === "BUTTON"
      ) {
        const code =
        btn.dataset.code;
        if(code){
          insertControlCode(
            code,
            btn.textContent.trim()
          );
        }
      }
    }
  );
};
document.addEventListener(
"DOMContentLoaded",
()=>{
  document
  .getElementById("prgFile")
  .addEventListener(
    "change",
    e =>
    loadPrgFile(
      e.target.files[0]
    )
  );
  setupGroup("modeGroup");
  setupGroup("qualityGroup");
  document
  .getElementById("btnClear")
  .addEventListener(
    "click",
    clearControlCodes
  );
  document
  .getElementById("btnClearAll")
  .addEventListener(
    "click",
    ()=>{
      document
      .getElementById("prgFile")
      .value="";
      prgContent="";
      displayMsg(
        "已清除文件",
        "success"
      );
    }
  );
  document
  .getElementById("btnDownload")
  .addEventListener(
    "click",
    downloadFile
  );
  displayMsg(
    "文件格式错误，请选择 PRG 加载文件。",
    "success"
  );
});
</script>
</body>
</html>
